<!doctype html>
<meta charset="utf-8">
<script>
  const target = location.pathname.endsWith('report.html') ? '../report.html' : '../index.html';
  const u = new URL(target, location.href);
  const p = new URLSearchParams(location.search);
  p.set('lang', 'en');
  u.search = p.toString();
  u.hash = location.hash;
  location.replace(u.toString());
</script>
