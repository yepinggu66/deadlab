];

const rows = RAW.map(r=>{
  const lv = {need:r[2], cap:r[3], econ:r[4], dist:r[5], dep:r[6], stam:r[7]};
  const s = runSim(lv, 600, 1234);
  const top = Object.entries(s.causeShare).sort((a,b)=>b[1]-a[1])[0];
  return {name:r[0], sector:r[1], pct:Math.round(s.s12*100), cause:CAUSES[top[0]].n, c:Math.round(top[1]*100)};
});

const sectors = [...new Set(rows.map(r=>r.sector))];
const sel = document.getElementById('sector');
sel.innerHTML = '<option value="">全部行业</option>' + sectors.map(s=>`<option>${s}</option>`).join('');

let sortKey = 's';
function draw(){
  const q = document.getElementById('q').value.trim();
  const sec = sel.value;
  let list = rows.filter(r=> (!q || r.name.includes(q) || r.sector.includes(q)) && (!sec || r.sector===sec));
  list.sort(sortKey==='s' ? (a,b)=>b.pct-a.pct : (a,b)=>a.name.localeCompare(b.name,'zh'));
  const cls = p => p>=55?'hi':p>=40?'mid':'lo';
  document.getElementById('count').textContent = `${list.length} / ${rows.length} 条`;
  document.getElementById('tb').innerHTML =
    `<thead><tr><th>#</th><th>项目</th><th>行业</th><th>24 个月存活率</th><th>最可能死于</th></tr></thead><tbody>`+
    list.map((r,i)=>`<tr><td>${String(i+1).padStart(3,'0')}</td><td>${r.name}</td><td>${r.sector}</td>
      <td class="pct ${cls(r.pct)}">${r.pct}%</td><td>${r.cause} <span style="color:var(--dim2)">${r.c}%</span></td></tr>`).join('')+
    `</tbody>`;
}
['q','sector','sort'].forEach(id=>document.getElementById(id).addEventListener('input', e=>{
  if(id==='sort') sortKey = e.target.value;
  draw();
}));
draw();
</script>
